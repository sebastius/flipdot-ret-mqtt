<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="600" height="300" fill="#ffffff"/>
  <!-- blokken -->
  <rect stroke="#222222" stroke-width="2" x="20" y="40" width="170" height="210" rx="6" fill="#f3f3f3"/>
  <rect stroke="#222222" stroke-width="2" x="430" y="40" width="150" height="210" rx="6" fill="#f3f3f3"/>
  <!-- TX: ESP GPIO15 -> 80C31 P3.0/RXD, direct -->
  <line stroke="#222222" stroke-width="2" fill="none" x1="190" y1="80" x2="430" y2="80"/>
  <polygon points="200,80 212,74 212,86" fill="#222222"/>
  <!-- RX: 80C31 P3.1/TXD -> R1 -> knoop -> GPIO13 -->
  <line stroke="#222222" stroke-width="2" fill="none" x1="190" y1="140" x2="230" y2="140"/>
  <rect stroke="#222222" stroke-width="2" x="230" y="130" width="60" height="20" fill="#ffffff"/>
  <line stroke="#222222" stroke-width="2" fill="none" x1="290" y1="140" x2="430" y2="140"/>
  <polygon points="420,140 408,134 408,146" fill="#222222"/>
  <!-- R2 naar massa -->
  <line stroke="#222222" stroke-width="2" fill="none" x1="340" y1="140" x2="340" y2="165"/>
  <rect stroke="#222222" stroke-width="2" x="330" y="165" width="20" height="45" fill="#ffffff"/>
  <line stroke="#222222" stroke-width="2" fill="none" x1="340" y1="210" x2="340" y2="230"/>
  <!-- massa -->
  <line stroke="#222222" stroke-width="2" fill="none" x1="190" y1="230" x2="430" y2="230"/>
  <circle cx="340" cy="140" r="4" fill="#222222"/>
  <circle cx="340" cy="230" r="4" fill="#222222"/>
  <g fill="#222222">
    <text x="105" y="30" text-anchor="middle" font-weight="bold">AZR 802/24 (80C31)</text>
    <text x="505" y="30" text-anchor="middle" font-weight="bold">ESP8266</text>
    <text x="30" y="85">P3.0/RXD (pin 10)</text>
    <text x="30" y="145">P3.1/TXD (pin 11)</text>
    <text x="30" y="163" font-size="11" fill="#666666">= TP TXD, 5 V</text>
    <text x="30" y="235">GND logica</text>
    <text x="570" y="85" text-anchor="end">GPIO15 (TX)</text>
    <text x="570" y="145" text-anchor="end">GPIO13 (RX)</text>
    <text x="570" y="235" text-anchor="end">GND</text>
    <text x="310" y="70" text-anchor="middle" font-size="12">direct, 3,3 V is genoeg (V_IH ≈ 1,9 V)</text>
    <text x="260" y="122" text-anchor="middle">R1 47 kΩ</text>
    <text x="358" y="192">R2 100 kΩ</text>
    <text x="385" y="132" text-anchor="middle" font-size="12">≈ 3,4 V</text>
    <text x="300" y="280" text-anchor="middle" font-size="13">uitgang 74HC14 (IC1A) naar RXD losgekoppeld · 5 V × 100k / 147k ≈ 3,4 V</text>
  </g>
</svg>
